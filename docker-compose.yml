services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foyz
      POSTGRES_USER: foyz
      POSTGRES_PASSWORD: foyz
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-with-a-long-random-string}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DATABASE_URL: postgresql+psycopg2://foyz:foyz@db:5432/foyz
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "flask --app wsgi.py init-db && gunicorn --workers 4 --bind 0.0.0.0:8000 --access-logfile - wsgi:app"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
