{% extends "base.html" %}
{% block title %}Équipe{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="h3 mb-0"><i class="bi bi-people-fill"></i> Équipe Foy'z / Bar</h1>
  <a class="btn btn-primary" href="{{ url_for('admin.comptes') }}"><i class="bi bi-person-plus"></i> Attribuer depuis les comptes</a>
</div>

<form class="card mb-3" method="get" action="{{ url_for('admin.equipe') }}" data-live-filter
      data-live-rows="#equipe-rows" data-live-footer="#equipe-footer">
  <div class="card-body row g-2 align-items-end">
    <div class="col-md-10">
      <label class="form-label small" for="f-q">Recherche</label>
      <input class="form-control" id="f-q" name="q" type="search" value="{{ q }}" placeholder="Ex : Dupont, Flavie…" autocomplete="off">
    </div>
    <div class="col-md-2 d-grid">
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.equipe') }}" data-live-reset>Réinitialiser</a>
    </div>
  </div>
</form>

<div class="card">
  <div class="table-responsive">
    <table class="table table-sm align-middle mb-0">
      <thead class="table-light">
        <tr><th>Membre</th><th>Statut</th><th>Campus</th></tr>
      </thead>
      <tbody id="equipe-rows">
        {% include "admin/_equipe_rows.html" %}
      </tbody>
    </table>
  </div>
  <div id="equipe-footer" class="card-footer small text-muted">
    {% include "admin/_equipe_footer.html" %}
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/admin_filter.js') }}"></script>
{% endblock %}
