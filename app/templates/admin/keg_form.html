{% extends "base.html" %}
{% block title %}Fût — {{ keg.name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4"><i class="bi bi-barrel"></i> Fût « {{ keg.name }} »</h1>

{% set br = keg.price_row('brest') %}
{% set pa = keg.price_row('paris') %}
<div class="card" style="max-width: 900px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nom du fût</label><input class="form-control" name="name" value="{{ keg.name }}" required></div>
        <div class="col-md-2"><label class="form-label">Degré (°)</label><input class="form-control" name="alcohol_degree" type="number" step="0.1" value="{{ '%.1f'|format(keg.alcohol_degree) }}"></div>
        <div class="col-md-2"><label class="form-label">Volume total (L)</label><input class="form-control" name="volume_l" type="number" step="0.5" value="{{ '%.1f'|format(keg.volume_l) }}"></div>
        <div class="col-md-2"><label class="form-label">Restant (L)</label><input class="form-control" name="remaining_l" type="number" step="0.1" value="{{ '%.1f'|format(keg.remaining_l) }}"></div>

        <div class="col-12"><strong>Brest</strong></div>
        <div class="col-md-2"><label class="form-label small">Demi std (€)</label><input class="form-control form-control-sm" name="brest_half_std" value="{{ '%.2f'|format(br.price_half_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pinte std (€)</label><input class="form-control form-control-sm" name="brest_pint_std" value="{{ '%.2f'|format(br.price_pint_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pot std (€)</label><input class="form-control form-control-sm" name="brest_pot_std" value="{{ '%.2f'|format(br.price_pot_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Demi équipe (€)</label><input class="form-control form-control-sm" name="brest_half_team" value="{{ '%.2f'|format(br.price_half_team / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pinte équipe (€)</label><input class="form-control form-control-sm" name="brest_pint_team" value="{{ '%.2f'|format(br.price_pint_team / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pot équipe (€)</label><input class="form-control form-control-sm" name="brest_pot_team" value="{{ '%.2f'|format(br.price_pot_team / 100) }}"></div>

        <div class="col-12"><strong>Paris</strong></div>
        <div class="col-md-2"><label class="form-label small">Demi std (€)</label><input class="form-control form-control-sm" name="paris_half_std" value="{{ '%.2f'|format(pa.price_half_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pinte std (€)</label><input class="form-control form-control-sm" name="paris_pint_std" value="{{ '%.2f'|format(pa.price_pint_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pot std (€)</label><input class="form-control form-control-sm" name="paris_pot_std" value="{{ '%.2f'|format(pa.price_pot_std / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Demi équipe (€)</label><input class="form-control form-control-sm" name="paris_half_team" value="{{ '%.2f'|format(pa.price_half_team / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pinte équipe (€)</label><input class="form-control form-control-sm" name="paris_pint_team" value="{{ '%.2f'|format(pa.price_pint_team / 100) }}"></div>
        <div class="col-md-2"><label class="form-label small">Pot équipe (€)</label><input class="form-control form-control-sm" name="paris_pot_team" value="{{ '%.2f'|format(pa.price_pot_team / 100) }}"></div>

        <div class="col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="active" {% if keg.active %}checked{% endif %}>
            <label class="form-check-label">Fût actif</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="refresh_articles" checked>
            <label class="form-check-label">Régénérer les articles tireuse si le fût est monté</label>
          </div>
        </div>
      </div>
      <button class="btn btn-primary mt-4">Enregistrer</button>
      <a class="btn btn-outline-secondary mt-4" href="{{ url_for('admin.tireuses') }}">Retour</a>
    </form>
  </div>
</div>
{% endblock %}
