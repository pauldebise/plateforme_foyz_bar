{% for u in members %}
<tr data-href="{{ url_for('admin.membre', user_id=u.id) }}">
  <td><strong>{{ u.display_name }}</strong></td>
  <td>{% if u.team_status == 'mandat' %}<span class="badge bg-success">mandat</span>{% else %}<span class="badge bg-secondary">ancien</span>{% endif %}</td>
  <td>{{ CAMPUSSES.get(u.team_campus, '—') }}</td>
</tr>
{% else %}
<tr><td colspan="3" class="text-center text-muted py-4">{% if q %}Aucun membre d'équipe ne correspond à « {{ q }} ».{% else %}Aucun membre d'équipe.{% endif %}</td></tr>
{% endfor %}
