{% extends "base.html" %}
{% block title %}Vérification — {{ site_name }}{% endblock %}
{% block content %}
<div class="login-hero">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1"><i class="bi bi-shield-lock"></i> Vérification en deux étapes</h1>
      <p class="text-center text-muted small mb-4">
        Saisissez le code à 6 chiffres affiché par votre application
        d'authentification, ou l'un de vos codes de secours.
      </p>
      <form method="post" action="{{ url_for('auth.mfa') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="mfa-code">Code à 6 chiffres</label>
          <input class="form-control form-control-lg text-center font-monospace" id="mfa-code"
                 name="code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="mfa-recovery">Code de secours (uniquement si nécessaire)</label>
          <input class="form-control font-monospace" id="mfa-recovery" name="recovery_code"
                 placeholder="XXXX-XXXX" autocomplete="off">
        </div>
        <button class="btn btn-primary w-100">Valider</button>
      </form>
      <form method="post" action="{{ url_for('auth.logout') }}" class="mt-3 text-center">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="btn btn-link btn-sm text-muted">Annuler</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
