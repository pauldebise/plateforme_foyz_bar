{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4"><i class="bi bi-link-45deg"></i> Liens utiles</h1>
<div class="row g-3">
  {% for l in links %}
  <div class="col-md-6">
    <a class="card text-decoration-none h-100" href="{{ l.url }}" target="_blank" rel="noopener noreferrer">
      <div class="card-body d-flex align-items-center gap-3">
        <i class="bi bi-box-arrow-up-right fs-4 text-primary"></i>
        <div>
          <div class="fw-semibold">{{ l.label }}</div>
          <div class="small text-muted text-truncate" style="max-width: 420px;">{{ l.url }}</div>
        </div>
      </div>
    </a>
  </div>
  {% else %}
  <p class="text-muted">Aucun lien pour le moment.</p>
  {% endfor %}
</div>
{% endblock %}
